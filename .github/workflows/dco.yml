name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sign-off:
    name: Verify sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history of the pull request is needed to check every commit.
          fetch-depth: 0

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "$BASE_SHA..$HEAD_SHA"
