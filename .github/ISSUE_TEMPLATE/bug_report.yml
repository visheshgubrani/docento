name: Bug report
description: Something is broken or behaves differently than documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security vulnerabilities here** —
        see [SECURITY.md](https://github.com/visheshgubrani/docento/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Concrete steps. A minimal reproduction is worth more than a paragraph of description.
      placeholder: |
        1. Create an academy with...
        2. Enroll a learner...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Docento?
      options:
        - Self-hosted via Docker Compose
        - Self-hosted, custom deployment
        - Local development
        - Managed hosting
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the product?
      options:
        - Authoring (courses, lessons, quizzes)
        - Learner experience
        - Payments or enrollment
        - Media or video
        - AI features
        - API or SDK
        - Authentication or permissions
        - Deployment or upgrade
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Redact tokens, keys, and personal data before pasting.
      render: shell
    validations:
      required: false
